name: CPU contracts
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy
      - run: python -m unittest test_council test_evidence_agents test_assistant -v
# GPU checks are manual on a supported CUDA/MSVC host; this workflow has not run remotely.
